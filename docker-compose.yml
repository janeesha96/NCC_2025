version: '3.8'

services:
  # Spring Boot Java Backend
  java-backend:
    build:
      context: ./backend2
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - app-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  # Node.js Express Backend
  nodejs-backend:
    build:
      context: ./backend2
      dockerfile: Dockerfile.nodejs
    ports:
      - "5000:5000"
    networks:
      - app-network
    environment:
      - NODE_ENV=production

  # Frontend (Nginx)
  frontend:
    build:
      context: ./frontend2
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - java-backend
      - nodejs-backend

networks:
  app-network:
    driver: bridge
